name: Product Owner refine (reusable)

# Reusable workflow. Call it from a small workflow of your repository, see examples/.
# The calling workflow decides the triggers, passes the inputs and has to grant at least the
# permissions of the job below, plus `actions: read` (see "Find the version of the scripts").

on:
  workflow_call:
    inputs:
      issue:
        description: 'Issue number to refine, or "scan" to let the bot pick candidates'
        required: false
        type: string
        default: scan
      max_issues:
        description: "Maximum number of tickets to look at in a scan (1-20)"
        required: false
        type: string
        default: "5"
      dry_run:
        description: "Only show what would change in the job summary, do not change anything"
        required: false
        type: boolean
        default: true
      apply:
        description: "Also create the sub-issues of a proposed split (without it, a split is only proposed in a comment)"
        required: false
        type: boolean
        default: false
      scripts_ref:
        description: 'Only used if the version cannot be found out (the caller lacks "actions: read"): branch, tag or commit of the scripts'
        required: false
        type: string
        default: v1
    secrets:
      LLM_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      PRODUCT_OWNER_CLIENT_ID:
        required: false
      PRODUCT_OWNER_APP_KEY:
        required: false
      PROJECT_TOKEN:
        required: false

jobs:
  refine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write # comment, label and edit issues, create sub-issues
      actions: read # find out which version of this workflow is running
    # The three Product Owner workflows share a group: two runs must never change the backlog at the same time
    concurrency:
      group: product-owner
      cancel-in-progress: false
    env:
      # secrets cannot be used in "if:" directly, so the check goes through an env variable
      APP_CONFIGURED: ${{ secrets.PRODUCT_OWNER_CLIENT_ID != '' && secrets.PRODUCT_OWNER_APP_KEY != '' }}
    steps:
      # A called workflow does not know which version of itself it runs (`github.job_workflow_sha` is
      # empty), but the run API does. The caller has to grant `actions: read` for it. Pinning the
      # caller to a tag, a branch or a commit therefore runs the scripts of exactly that version.
      - name: Find the version of the scripts
        id: bots
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: product-owner-refine.yml
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" 2>/dev/null \
            | jq -r --arg f "/.github/workflows/$WORKFLOW_FILE@" \
              '[.referenced_workflows[]? | select(.path | contains($f))][0] | select(. != null) | "\(.path) \(.sha)"') || found=""
          if [ -n "$found" ]; then
            repository="${found%%/.github/workflows/*}"
            sha="${found##* }"
            echo "Scripts: $repository at $sha"
          else
            repository="learosema-adesso/review-and-product-owner-bots"
            sha="$SCRIPTS_REF"
            echo "::warning::Could not find out which version of $WORKFLOW_FILE is running. The calling workflow needs 'permissions: actions: read'. Using $repository at '$sha' instead."
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.bots.outputs.repository }}
          ref: ${{ steps.bots.outputs.sha }}
          path: bots

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bots/scripts/package-lock.json

      - name: Install Dependencies
        run: npm ci --ignore-scripts --prefix bots/scripts

      # Preferred: a GitHub App. Its token lives for about an hour, is limited to this repository
      # and is not tied to a person. Reading sizes and priorities and writing them needs the board and the organization's issue fields, which the workflow token cannot reach.
      - name: Create GitHub App token
        id: app
        if: env.APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PRODUCT_OWNER_CLIENT_ID }}
          private-key: ${{ secrets.PRODUCT_OWNER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Product Owner refine
        uses: actions/github-script@v9
        env:
          # AI provider: gemini (default) or any OpenAI-compatible service, see the README
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # the Gemini names keep working while the LLM_ ones are not set
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_PROJECT_ID: ${{ vars.GEMINI_PROJECT_ID }}
          GEMINI_LOCATION: ${{ vars.GEMINI_LOCATION }}
          PROJECT_TOKEN: ${{ steps.app.outputs.token || secrets.PROJECT_TOKEN }}
          PROJECT_URL: ${{ vars.PROJECT_URL }}
          # passed via env, never interpolated into the script
          ISSUE: ${{ inputs.issue }}
          MAX_ISSUES: ${{ inputs.max_issues }}
          DRY_RUN: ${{ inputs.dry_run }}
          APPLY: ${{ inputs.apply }}
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          script: |
            const path = require('path');
            const { pathToFileURL } = require('url');
            const file = path.join(process.env.GITHUB_WORKSPACE, 'bots/scripts/productowner-refine.mjs');
            const { productOwnerRefine } = await import(pathToFileURL(file).href);
            await productOwnerRefine({
              github,
              projectGithub: process.env.PROJECT_TOKEN ? getOctokit(process.env.PROJECT_TOKEN) : null,
              context,
              core,
              issue: process.env.ISSUE,
              maxIssues: process.env.MAX_ISSUES,
              dryRun: process.env.DRY_RUN !== 'false',
              apply: process.env.APPLY === 'true',
              projectUrl: process.env.PROJECT_URL,
            });
