name: BullyBot (reusable)

# Reusable workflow. Call it from a small workflow of your repository, see examples/.
# The calling workflow decides the triggers, passes the inputs and has to grant at least the
# permissions of the job below. That includes `actions: read` (see "Find the version of the scripts"):
# without it GitHub rejects the run at startup.

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Number of the PR to review. Not needed for pull_request events, they bring their own."
        required: false
        type: number
        default: 0
      scripts_ref:
        description: "Only used if the version of the scripts cannot be found out through the API: branch, tag or commit of the scripts"
        required: false
        type: string
        default: v1
    secrets:
      LLM_API_KEY:
        required: false
      GEMINI_API_KEY:
        required: false
      PRODUCT_OWNER_CLIENT_ID:
        required: false
      PRODUCT_OWNER_APP_KEY:
        required: false

jobs:
  bully:
    # Bot PRs (Dependabot, Renovate, ...) don't get secrets: don't even start the job.
    # Review comments written by bots are ignored as well.
    # A run with an explicit PR number (workflow_dispatch or any other trigger) always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      inputs.pr_number > 0 ||
      (github.event.pull_request.user.type != 'Bot' &&
      !endsWith(github.event.pull_request.user.login, '[bot]') &&
      (github.event_name != 'pull_request_review_comment' ||
      github.event.comment.user.type != 'Bot'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read # linked issues and their acceptance criteria
      pull-requests: write
      actions: read # find out which version of this workflow is running
    concurrency:
      # Comments of the GitHub App (BullyBot's own) start runs that do nothing. They get their own
      # group, so they can never push a waiting run of the same PR out of the queue.
      group: bullybot-${{ github.event.pull_request.number || inputs.pr_number }}${{ github.event.comment.user.type == 'Bot' && '-bot' || '' }}
      # a thread reply must not cancel a running full review; it waits in the queue instead
      cancel-in-progress: ${{ github.event_name != 'pull_request_review_comment' }}
    env:
      # secrets cannot be used in "if:" directly, so the check goes through an env variable
      APP_CONFIGURED: ${{ secrets.PRODUCT_OWNER_CLIENT_ID != '' && secrets.PRODUCT_OWNER_APP_KEY != '' }}
    steps:
      # A called workflow does not know which version of itself it runs (`github.job_workflow_sha` is
      # empty), but the run API does, which is why the caller has to grant `actions: read`. Pinning the
      # caller to a tag, a branch or a commit therefore runs the scripts of exactly that version.
      - name: Find the version of the scripts
        id: bots
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: bullybot.yml
          SCRIPTS_REF: ${{ inputs.scripts_ref }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" 2>/dev/null \
            | jq -r --arg f "/.github/workflows/$WORKFLOW_FILE@" \
              '[.referenced_workflows[]? | select(.path | contains($f))][0] | select(. != null) | "\(.path) \(.sha)"') || found=""
          if [ -n "$found" ]; then
            repository="${found%%/.github/workflows/*}"
            sha="${found##* }"
            echo "Scripts: $repository at $sha"
          else
            repository="learosema-adesso/review-and-product-owner-bots"
            sha="$SCRIPTS_REF"
            echo "::warning::Could not find out which version of $WORKFLOW_FILE is running (the run could not be read through the API). Using $repository at '$sha' instead."
          fi
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the scripts
        uses: actions/checkout@v7
        with:
          repository: ${{ steps.bots.outputs.repository }}
          ref: ${{ steps.bots.outputs.sha }}
          path: bots

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bots/scripts/package-lock.json

      - name: Install Dependencies
        run: npm ci --ignore-scripts --prefix bots/scripts

      # With the GitHub App, BullyBot's comments come from the app and he can resolve review threads
      # himself (the workflow token cannot). The app needs "Pull requests: Read and write" and, because GitHub
      # only lets an app resolve threads with it, "Contents: Read and write" (checked on a throwaway PR).
      # If the token cannot be created (secrets missing, permission not accepted yet), he carries on
      # with the workflow token and asks the human to click "Resolve", as before.
      - name: Create GitHub App token
        id: app
        if: env.APP_CONFIGURED == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PRODUCT_OWNER_CLIENT_ID }}
          private-key: ${{ secrets.PRODUCT_OWNER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-issues: read
          permission-pull-requests: write

      - name: Run Mean AI Reviewer
        uses: actions/github-script@v9
        env:
          # AI provider: gemini (default) or any OpenAI-compatible service, see the README
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          # the Gemini names keep working while the LLM_ ones are not set
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_PROJECT_ID: ${{ vars.GEMINI_PROJECT_ID }}
          GEMINI_LOCATION: ${{ vars.GEMINI_LOCATION }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          # true only when the app token exists: then he resolves threads himself
          CAN_RESOLVE_THREADS: ${{ steps.app.outputs.token != '' }}
          # longest suggestion he posts when asked to "fix it" (default 40)
          BULLYBOT_FIX_MAX_LINES: ${{ vars.BULLYBOT_FIX_MAX_LINES }}
        with:
          github-token: ${{ steps.app.outputs.token || github.token }}
          script: |
            const path = require('path');
            const { pathToFileURL } = require('url');
            const file = path.join(process.env.GITHUB_WORKSPACE, 'bots/scripts/bullybot.mjs');
            const { bullybot } = await import(pathToFileURL(file).href);
            await bullybot({
              github,
              context,
              core,
              prNumber: Number(process.env.PR_NUMBER),
              canResolveThreads: process.env.CAN_RESOLVE_THREADS === 'true',
              fixMaxLines: process.env.BULLYBOT_FIX_MAX_LINES,
            });
