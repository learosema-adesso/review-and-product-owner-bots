- name: Run Mean AI Reviewer
  env:
    GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  uses: actions/github-script@v7
  with:
    github-token: ${{ secrets.BOT_USER_TOKEN || github.token }}
    script: |
      const { bullybot } = await import('./scripts/bullybot.mjs');
      await bullybot({ github, context, core });
