name: Bullybot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Number of the PR to review'
        required: true
        type: number

permissions:
  contents: read
  issues: read # linked issues and their acceptance criteria
  pull-requests: write

concurrency:
  group: bullybot-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  bully:
    # Bot PRs (Dependabot, Renovate, ...) don't get secrets: don't even start the job.
    # workflow_dispatch has no pull_request event and always runs.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.user.type != 'Bot' &&
      !endsWith(github.event.pull_request.user.login, '[bot]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json
      
      - name: Install Dependencies
        run: npm ci --ignore-scripts --prefix scripts

      - name: Run Mean AI Reviewer
        uses: actions/github-script@v9
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          github-token: ${{ github.token }}
          script: |
            const path = require('path');
            const { pathToFileURL } = require('url');
            const file = path.join(process.env.GITHUB_WORKSPACE, 'scripts/bullybot.mjs');
            const { bullybot } = await import(pathToFileURL(file).href);
            await bullybot({
              github,
              context,
              core,
              prNumber: Number(process.env.PR_NUMBER),
            });