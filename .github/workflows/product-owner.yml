name: Product Owner

on:
  workflow_dispatch:
    inputs:
      direction:
        description: 'Rough direction for new features (e.g. "teams should be able to vote on meeting times")'
        required: true
        type: string
      max_tickets:
        description: 'Maximum number of tickets to create (1-12)'
        required: false
        default: '6'
        type: string
      dry_run:
        description: 'Only show the plan in the job summary, do not create anything'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  issues: write # create issues and link sub-issues

# Two runs at the same time could create the same tickets twice
concurrency:
  group: product-owner
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      # secrets cannot be used in "if:" directly, so the check goes through an env variable
      APP_CONFIGURED: ${{ secrets.PRODUCT_OWNER_CLIENT_ID != '' && secrets.PRODUCT_OWNER_APP_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install Dependencies
        run: npm ci --ignore-scripts --prefix scripts

      # Preferred: a GitHub App. Its token lives for about an hour, is limited to this repository
      # and is not tied to a person. The workflow token cannot write to Projects or read the
      # organization's issue fields, so the app token is used for everything below.
      - name: Create GitHub App token
        id: app
        if: env.APP_CONFIGURED == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.PRODUCT_OWNER_CLIENT_ID }}
          private-key: ${{ secrets.PRODUCT_OWNER_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Product Owner
        uses: actions/github-script@v9
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # App token if the app is configured, otherwise a personal access token (fallback).
          # Without either, tickets are still created, just not added to the board.
          PROJECT_TOKEN: ${{ steps.app.outputs.token || secrets.PROJECT_TOKEN }}
          PROJECT_URL: ${{ vars.PROJECT_URL }}
          # passed via env, never interpolated into the script, so the text cannot inject code
          DIRECTION: ${{ inputs.direction }}
          MAX_TICKETS: ${{ inputs.max_tickets }}
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          # with the app token, the issues are created by the app instead of github-actions
          github-token: ${{ steps.app.outputs.token || github.token }}
          script: |
            const path = require('path');
            const { pathToFileURL } = require('url');
            const file = path.join(process.env.GITHUB_WORKSPACE, 'scripts/productowner.mjs');
            const { productOwner } = await import(pathToFileURL(file).href);
            await productOwner({
              github,
              projectGithub: process.env.PROJECT_TOKEN ? getOctokit(process.env.PROJECT_TOKEN) : null,
              context,
              core,
              direction: process.env.DIRECTION,
              maxTickets: process.env.MAX_TICKETS,
              dryRun: process.env.DRY_RUN === 'true',
              projectUrl: process.env.PROJECT_URL,
            });
