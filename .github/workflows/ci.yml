name: CI

# Tests and formatting of the bots. The review of pull requests is done by BullyBot, see review.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # a newer push replaces the run of a pull request, but every commit on main keeps its result
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: scripts/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts
        working-directory: scripts

      - name: Run the tests
        run: npm test
        working-directory: scripts

      - name: Check the formatting
        run: npx --yes prettier@3.8.1 --check .
