# Copy this file to .github/workflows/bullybot.yml of your repository.
#
# BullyBot reviews every pull request, answers replies in his review threads and, on request
# ("fix it" in a thread), suggests a fix. Setup (secrets, GitHub App) is in the README.
name: BullyBot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # replies in review threads: he only re-checks his own threads (no full review)
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Number of the PR to review'
        required: true
        type: number

# What the called workflow needs. "actions: read" lets it find out which version of the scripts
# it runs. Without it GitHub rejects the run at startup.
permissions:
  contents: read
  issues: read
  pull-requests: write
  actions: read

jobs:
  bullybot:
    # In a public repository everybody can comment: only the people who work on it may make the
    # bot spend tokens by replying in a thread. Keep this condition.
    if: >-
      github.event_name != 'pull_request_review_comment' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) ||
      github.event.comment.user.type == 'Bot'
    uses: learosema-adesso/review-and-product-owner-bots/.github/workflows/bullybot.yml@v1
    with:
      pr_number: ${{ inputs.pr_number || 0 }}
      # Optional: let him push a fix to the branch of the pull request when someone replies "fix it" in
      # one of his threads, after this command passed on the fixed code. Needs the GitHub App. The command
      # runs in a job without secrets and without write access. Without it he only suggests fixes.
      # fix_test_command: npm ci && npm test
      # fix_node_version_file: .nvmrc
    secrets: inherit
